name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 05:17 in Amsterdam (summer time); off the hour to dodge queueing
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open and close venue-health issues
  actions: write # read the last run's data and cache, and re-enable this schedule

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal night takes minutes. Cold caches take longer, but the build's per-run budgets
    # (LLM calls, MusicBrainz/Last.fm/Wikipedia requests, voice clips) cap each night's share
    # of the work.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}

      # The voice model (Kokoro, ~350 MB in data/cache/models) is fixed by the checksums pinned
      # in voice.py, so unlike the growing pipeline cache below it suits actions/cache: one
      # immutable entry per model version, keyed on those checksums. Saved after the build.
      - name: Voice model cache key
        id: model-key
        run: |
          sums=$(grep -oE '"[0-9a-f]{64}"' pipeline/src/giggle_pipeline/voice.py | sha256sum)
          echo "key=kokoro-v1.0-fp32-${sums:0:16}" >> "$GITHUB_OUTPUT"
      - name: Restore the voice model
        id: model
        uses: actions/cache/restore@v4
        with:
          path: data/cache/models
          key: ${{ steps.model-key.outputs.key }}

      # The previous run's counts are the baseline for spotting broken venues, and its
      # data/site/voice/ clips are kept, so only new announcements get rendered.
      - name: Fetch the previous run's health history and voice clips
        run: |
          run=$(gh run list --workflow nightly.yml --status success --limit 1 \
            --json databaseId -q '.[0].databaseId')
          if [ -n "$run" ]; then
            gh run download "$run" --name site-data --dir data/site || true
          fi

      # data/cache holds LLM line-ups, MusicBrainz, Last.fm and Wikipedia lookups
      # (pipeline.sqlite) and YouTube Music lookups (ytmusic.json). Each night adds to it, so
      # lookups spread over nights instead of repeating. It travels as an artifact, not via
      # actions/cache: cache entries are immutable per key (a growing cache needs a new key
      # every night plus restore-keys) and are evicted after 7 days unused, sharing the 10 GB
      # repo quota with the uv cache. An artifact is simply "the latest copy", kept 30 days
      # and downloadable for debugging. Entries are keyed on their inputs, so a copy from a
      # failed or timed-out run is still valid: take the newest, whatever the run's outcome.
      - name: Restore the pipeline cache
        env:
          BRANCH: ${{ github.ref_name }} # the default branch for scheduled runs
        run: |
          # shellcheck disable=SC2016 # $ENV.BRANCH is jq's, not the shell's
          run=$(gh api "repos/$GH_REPO/actions/artifacts?name=pipeline-cache&per_page=20" \
            -q '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == $ENV.BRANCH)]
                | .[0].workflow_run.id // empty')
          if [ -z "$run" ]; then
            echo "No pipeline cache yet: starting cold."
          elif ! gh run download "$run" --name pipeline-cache --dir data/cache; then
            echo "::warning::Couldn't restore the pipeline cache from run $run; starting cold."
          fi
          ls -la data/cache 2>/dev/null || true

      - name: Build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          # An unset secret arrives as "". Unset it so the build sees it as missing and
          # falls back (title rules instead of Workers AI; no Last.fm).
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN LASTFM_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name is not set; the build will do without it."
              unset "$name"
            fi
          done
          # The voice extra (kokoro-onnx) renders announcer clips; `uv run` keeps it installed.
          nix develop -c uv sync --all-packages --extra voice
          nix develop -c make data

      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: data/site
          retention-days: 30

      # Also after a failed or timed-out build: whatever it looked up is worth keeping. The
      # voice model has its own cache (above), so it stays out of this artifact.
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('data/cache/**') != ''
        with:
          name: pipeline-cache
          path: |
            data/cache
            !data/cache/models
          retention-days: 30

      # Only once both files are complete (an interrupted download leaves just a .part file).
      - name: Save the voice model
        if: >-
          always() && steps.model.outputs.cache-hit != 'true'
          && hashFiles('data/cache/models/kokoro-v1.0.onnx') != ''
          && hashFiles('data/cache/models/voices-v1.0.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/models
            !data/cache/models/*.part
          key: ${{ steps.model-key.outputs.key }}

      - name: Open or close venue-health issues
        if: always() && hashFiles('data/site/health.json') != ''
        run: nix develop -c uv run giggle-issues data/site/health.json

      # GitHub disables schedules in public repos after 60 days without activity.
      - name: Keep this schedule enabled
        if: always()
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/nightly.yml/enable"
