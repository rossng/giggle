name: deploy

# Puts the site live on Cloudflare: the web app from a tested commit on main, with the latest
# nightly site data (gigs, artists, announcer clips), served by the Worker (worker/). Runs after
# each successful nightly build and after each green test run on main, or by hand.
#
# Two jobs, so the deploy token never shares a runner with the web toolchain: `build` (no
# secrets) builds web/build with everything pnpm installs; `deploy` (the `production`
# environment, which holds the token) installs only the Worker's own dependencies, with no
# install scripts, and has wrangler bundle the Worker and upload web/build as it is.
on:
  workflow_run:
    workflows: [nightly, test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the nightly's site-data artifact, and the test runs' results

jobs:
  build:
    # A scheduled or manual nightly that built, or tests that passed on a push to main; always
    # this repo's own runs (a fork's pull request can run edited copies of those workflows, from
    # a head branch it may also call main).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && ((github.event.workflow_run.name == 'nightly'
               && (github.event.workflow_run.event == 'schedule'
                   || github.event.workflow_run.event == 'workflow_dispatch'))
              || (github.event.workflow_run.name == 'test'
                  && github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One build at a time (a newer run waiting replaces an older one), so deploys start in order.
    concurrency:
      group: deploy-build
      cancel-in-progress: false
    # GH_TOKEN is set only on the steps that run gh.
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      # Never ship a commit whose tests didn't pass: the commit the tests just passed on, or
      # (after a nightly, or by hand) the newest commit on main whose tests passed, so a red
      # main doesn't hold back new data.
      - name: Pick a tested commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.name == 'test' && github.event.workflow_run.head_sha || '' }}
        run: |
          sha=$TESTED
          if [ -z "$sha" ]; then
            sha=$(gh run list --workflow test.yml --branch main --event push --status success \
              --limit 1 --json headSha -q '.[0].headSha')
          fi
          if [ -z "$sha" ]; then
            echo "::error::No commit on main has passed its tests."
            exit 1
          fi
          echo "Deploying $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      # The top-level (production) D1 id is still the placeholder until the database exists.
      # (The deploy job checks for the token, which this job can't see.)
      - name: Ready to deploy?
        id: ready
        run: |
          ready=true
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' worker/wrangler.jsonc; then
            echo "::notice::The production D1 database_id isn't set: not deploying (worker/README.md)."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      # From this repo's own newest successful nightly on main (scheduled or by hand) that still
      # has its site-data artifact: never by artifact name alone, as a fork's pull request can
      # upload one with the same name.
      - name: Fetch the latest nightly site data
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow nightly.yml --branch main --status success --limit 100 \
              --json databaseId,event,headBranch \
              -q '.[] | select((.event == "schedule" or .event == "workflow_dispatch")
                               and .headBranch == "main") | .databaseId' |
            while read -r id; do
              if [ -n "$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts?name=site-data" \
                  -q '.artifacts[] | select(.expired | not) | .id')" ]; then
                echo "$id"
                break
              fi
            done)
          if [ -z "$run" ]; then
            echo "::error::No successful nightly run with site data to deploy (they're kept 90 days): run the nightly."
            exit 1
          fi
          gh run download "$run" --name site-data --dir data/site
          echo "Site data from nightly run $run: $(jq -r .generated data/site/gigs.json)"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.ready.outputs.ready == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build the site
        if: steps.ready.outputs.ready == 'true'
        run: |
          nix develop -c pnpm install --frozen-lockfile
          nix develop -c make web-build

      # Static files only: the deploy job uploads them and runs nothing from them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its secrets (CLOUDFLARE_DEPLOY_TOKEN, HEALTHCHECK_URL) are only given to jobs on main.
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Ready to deploy?
        id: ready
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_DEPLOY_TOKEN is not set: not deploying (worker/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The Worker's source, config and migrations: the same tested commit the build used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          name: web-build
          path: web/build

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: steps.ready.outputs.ready == 'true'
      # wrangler and the Worker's runtime dependencies only (no web toolchain), and no install
      # scripts: deploying needs neither workerd's nor esbuild's (the bundle is the same).
      - name: Install wrangler
        if: steps.ready.outputs.ready == 'true'
        run: nix develop -c pnpm install --frozen-lockfile --filter @giggle/worker --ignore-scripts

      - name: Migrate the database and deploy the Worker
        if: steps.ready.outputs.ready == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        # bash -eo pipefail: a failed `wrangler deploy | tee` must fail the step.
        shell: bash
        run: |
          nix develop -c pnpm exec wrangler d1 migrations apply DB --remote --env=""
          # Cloudflare's API sometimes fails an upload with an "unknown error": try again.
          for attempt in 1 2 3; do
            if nix develop -c pnpm exec wrangler deploy --env="" | tee deploy.log; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::wrangler deploy failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # On the workers.dev URL wrangler printed, or the repo variable SITE_URL if set. Fails on
      # data more than 3 days old too.
      - name: Check the live site
        if: steps.ready.outputs.ready == 'true'
        id: smoke
        env:
          URL: ${{ vars.SITE_URL || steps.deploy.outputs.url }}
        run: nix develop -c node scripts/smoke-test.mjs "$URL"

      # A dead man's switch (healthchecks.io conventions), if the HEALTHCHECK_URL secret is set:
      # a ping when the live site checks out, /fail when this workflow fails. A night without
      # either (the nightly failed, so nothing deployed) alerts too, once the check's grace runs
      # out.
      - name: Ping the health check
        if: steps.smoke.outcome == 'success'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL"
          fi

  # A failed build or deploy: /fail to the health check (whose URL only production jobs see).
  report-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Report the failure to the health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL/fail"
          fi
