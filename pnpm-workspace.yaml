packages:
  - web
  - packages/radio-core
  - worker

# Only these dependencies may run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
  # kokoro-js (via transformers.js) pulls these in for Node; the browser needs none of their
  # native builds.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
