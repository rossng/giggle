<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- YouTube embeds need a referrer to identify the page (otherwise: error 153). -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>giggle · radio preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#15111c;--p1:#1d1827;--p2:#272036;--p3:#322a45;--ink:#f3eef9;--mute:#9a91ae;
  --line:#2f2840;--amber:#ffb547;--good:#8fe0b0;--blue:#afbdff;--red:#ff6b80;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Hanken Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:600 10px/1 var(--mono);background:var(--bg);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.label{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--p1)}
.wordmark{font:800 30px/.9 var(--display);display:flex;gap:6px;align-items:flex-start}
.wordmark span{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--bg);background:var(--amber);padding:3px 4px;border-radius:3px;margin-top:3px}
.group{display:flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:6px;color:var(--mute);font-size:12px}
.seg button.on{background:var(--p3);color:var(--ink);font-weight:600}
select{font:inherit;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 6px;max-width:190px}
.stats{margin-left:auto;color:var(--mute);font-size:12px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.stage{padding:22px 28px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.np{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;align-items:start}
.media{display:flex;flex-direction:column;gap:10px}
.photo{aspect-ratio:1;border-radius:10px;background:var(--p2) center/cover no-repeat;position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(0,0,0,.25) 1px,transparent 1.4px);background-size:4px 4px;mix-blend-mode:multiply}
.video{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.video iframe,.video>div{width:100%;height:100%;display:block}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.track{color:var(--mute);font-size:16px}
.artist{font:800 clamp(44px,6vw,84px)/.86 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.ticket{display:flex;background:var(--p2);border-radius:8px;overflow:hidden;max-width:560px}
.t-date{width:66px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px dashed var(--line);padding:8px 0}
.t-date b{font:800 30px/.9 var(--display);color:var(--amber)}
.t-date span{font:600 10px/1 var(--mono);letter-spacing:.12em;color:var(--mute)}
.t-body{padding:9px 14px;flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.t-venue{font-weight:650;font-size:15px}
.t-meta{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.t-links{display:flex;flex-direction:column;justify-content:center;gap:4px;padding-right:14px;font-size:12.5px;font-weight:600}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
.soldout{color:var(--red)!important}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--p1);border:1px solid var(--line);color:var(--mute)}
.desc{font-size:13px;color:#cfc8dc;max-width:70ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.open{-webkit-line-clamp:unset}
.debug{font:500 11px var(--mono);color:var(--mute)}
.voice{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(255,181,71,.28);background:linear-gradient(90deg,rgba(255,181,71,.10),transparent 70%);border-radius:10px;padding:10px 14px;max-width:760px}
.voice[hidden]{display:none}
.voice .label{color:var(--amber);display:block;margin-bottom:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;background:var(--p2);border:1px solid transparent;font-weight:600;font-size:12.5px}
.btn.primary{background:var(--amber);color:var(--bg)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mute)}
.btn.on{outline:2px solid var(--amber)}
.btn.primary kbd{background:rgba(0,0,0,.14);border-color:transparent;color:var(--bg)}
.progress{display:flex;align-items:center;gap:10px;font:500 11px var(--mono);color:var(--mute);max-width:560px}
.progress .track-bar{flex:1;height:4px;background:var(--p3);border-radius:2px;overflow:hidden}
.progress .track-bar i{display:block;height:100%;width:0;background:var(--amber)}
aside{border-left:1px solid var(--line);background:var(--p1);display:flex;flex-direction:column;min-height:0}
aside .head{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
#queue{list-style:none;margin:0;padding:0 8px 12px;overflow:auto;flex:1}
#queue li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
#queue li:hover{background:var(--p2)}
#queue li.current{background:var(--p3)}
#queue li.dim{opacity:.4}
#queue .thumb{width:38px;height:38px;border-radius:5px;background:var(--p2) center/cover}
#queue b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#queue span{font-size:11.5px;color:var(--mute)}
.state{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.s-maybe{color:var(--blue)}.s-go{color:var(--amber)}.s-tix{color:var(--good)}.s-nope{color:var(--mute)}
details.misses{padding:8px 16px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);max-height:40%;overflow:auto}
details.misses summary{cursor:pointer}
details.misses li{margin:2px 0}
.start{position:fixed;inset:0;background:rgba(10,8,14,.82);display:grid;place-items:center;z-index:5}
.start[hidden]{display:none}
.start div{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:440px}
.start h2{font:800 56px/.9 var(--display);text-transform:uppercase;margin:0}
.start p{color:var(--mute);margin:0}
@media (max-width:900px){main{grid-template-columns:1fr}.np{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="wordmark">giggle<span>PREVIEW</span></div>
  <div class="group"><span class="label">Next</span><div class="seg" id="days"></div></div>
  <div class="group"><span class="label">City</span><div class="seg" id="cities"></div></div>
  <div class="group"><span class="label">Order</span><div class="seg" id="order"></div></div>
  <div class="group"><span class="label">Tracks</span><div class="seg" id="tracks"></div></div>
  <div class="group"><span class="label">Voice</span><div class="seg" id="voiceMode"></div><select id="voiceName"></select></div>
  <div class="group"><div class="seg" id="hide"></div></div>
  <span class="stats" id="stats"></span>
</header>
<main>
  <section class="stage">
    <div class="np">
      <div class="media">
        <div class="photo" id="photo"></div>
        <div class="video"><div id="yt"></div></div>
      </div>
      <div class="info">
        <span class="eyebrow" id="eyebrow">&nbsp;</span>
        <span class="track" id="track"></span>
        <span class="artist" id="artist"></span>
        <div class="ticket">
          <div class="t-date"><b id="tDay"></b><span id="tMon"></span></div>
          <div class="t-body"><span class="t-venue" id="tVenue"></span><span class="t-meta" id="tMeta"></span></div>
          <div class="t-links" id="tLinks"></div>
        </div>
        <div class="facts" id="facts"></div>
        <div class="tags" id="tags"></div>
        <div class="desc" id="desc" title="Click to expand"></div>
        <div class="debug" id="debug"></div>
      </div>
    </div>
    <div class="voice" id="voice" hidden><div><span class="label">Announcer</span><span id="voiceText"></span></div></div>
    <div class="progress"><span id="tNow">0:00</span><div class="track-bar"><i id="tBar"></i></div><span id="tLen">0:00</span></div>
    <div class="bar">
      <button class="btn ghost" id="prev" title="Previous track">◀◀ <kbd>←</kbd></button>
      <button class="btn primary" id="play">Play <kbd>space</kbd></button>
      <button class="btn ghost" id="next" title="Next track">▶▶ <kbd>→</kbd></button>
      <button class="btn ghost" id="nextArtist">Next artist <kbd>N</kbd></button>
    </div>
    <div class="bar">
      <span class="label">Sort this artist</span>
      <button class="btn" data-sort="maybe"><kbd>1</kbd>Listen more</button>
      <button class="btn" data-sort="go"><kbd>2</kbd>Want to go</button>
      <button class="btn" data-sort="tix"><kbd>3</kbd>Got tickets</button>
      <button class="btn ghost" data-sort="nope"><kbd>X</kbd>Not for me</button>
    </div>
  </section>
  <aside>
    <div class="head"><span class="label">Up next</span><span class="label" id="board"></span></div>
    <ol id="queue"></ol>
    <details class="misses"><summary id="missTitle"></summary><ul id="misses"></ul></details>
  </aside>
</main>
<div class="start" id="start"><div>
  <h2>Gig radio</h2>
  <p id="startText"></p>
  <button class="btn primary" id="go">Start listening <kbd>space</kbd></button>
  <p class="debug">Rough preview: artist names come from simple title rules, songs from YouTube Music search.</p>
</div></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem("giggle-" + key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("giggle-" + key, JSON.stringify(value)); } catch {} },
};

// ---------- settings ----------
const cities = [...new Set(DATA.queue.map((q) => q.gig.city))].sort((a, b) => (a === "Amsterdam" ? -1 : b === "Amsterdam" ? 1 : a.localeCompare(b)));
const settings = {
  days: store.get("days", Math.min(7, DATA.days)),
  cities: store.get("cities", cities),
  tracks: store.get("tracks", 2),
  voiceMode: store.get("voiceMode", "short"),
  voiceName: store.get("voiceName", null),
  hideNope: store.get("hideNope", true),
  order: store.get("order", "mix"),
  seed: store.get("seed", Date.now() % 1e9),
};
let triage = store.get("triage", {});

function seg(id, options, current, onPick, multi = false) {
  const box = $(id);
  box.replaceChildren(...options.map(([value, label]) => {
    const on = multi ? current.includes(value) : current === value;
    return el("button", {className: on ? "on" : "", textContent: label, onclick: () => onPick(value)});
  }));
}
function renderSettings() {
  seg("days", [3, 7, 14].filter((d) => d <= DATA.days).map((d) => [d, d + "d"]), settings.days, (v) => change("days", v));
  seg("cities", cities.map((c) => [c, c]), settings.cities, (c) => change("cities",
    settings.cities.includes(c) ? settings.cities.filter((x) => x !== c) : [...settings.cities, c]), true);
  seg("order", [["date", "Soonest"], ["mix", "Mix ⟳"], ["shuffle", "Shuffle ⟳"]], settings.order, (v) => {
    if (v === settings.order && v !== "date") change("seed", Math.floor(Math.random() * 1e9));  // reshuffle
    else change("order", v);
  });
  seg("tracks", [1, 2, 3].map((n) => [n, String(n)]), settings.tracks, (v) => change("tracks", v));
  seg("voiceMode", [["off", "Off"], ["name", "Name"], ["short", "Short"]], settings.voiceMode, (v) => change("voiceMode", v, false));
  seg("hide", [[true, "Hide “not for me”"]], settings.hideNope ? true : null, () => change("hideNope", !settings.hideNope));
}
function change(key, value, rebuild = true) {
  settings[key] = value;
  store.set(key, value);
  renderSettings();
  if (rebuild) buildPlaylist(true);
}

// ---------- voices ----------
function loadVoices() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.startsWith("en"));
  voices.sort((a, b) => (b.lang === "en-GB") - (a.lang === "en-GB") || a.name.localeCompare(b.name));
  if (!voices.length) return;
  if (!settings.voiceName || !voices.some((v) => v.name === settings.voiceName)) {
    settings.voiceName = (voices.find((v) => v.lang === "en-GB") || voices[0]).name;
  }
  $("voiceName").replaceChildren(...voices.map((v) =>
    el("option", {value: v.name, textContent: `${v.name} (${v.lang})`, selected: v.name === settings.voiceName})));
}
speechSynthesis.addEventListener?.("voiceschanged", loadVoices);
loadVoices();
$("voiceName").onchange = (e) => { settings.voiceName = e.target.value; store.set("voiceName", e.target.value); announce("This is how I sound."); };

// ---------- playlist ----------
let playlist = [];  // [{artist, gig, parsed, tracks}]
let ai = 0, ti = 0;

function buildPlaylist(keepCurrent = false) {
  const current = playlist[ai]?.artist.browseId;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const until = new Date(today.getTime() + settings.days * 86400000);
  const seen = new Set();
  playlist = [];
  for (const q of DATA.queue) {
    const id = q.artist.browseId;
    if (seen.has(id)) continue;
    if (new Date(q.gig.start) >= until || !settings.cities.includes(q.gig.city)) continue;
    if (settings.hideNope && triage[id] === "nope") continue;
    seen.add(id);
    playlist.push({...q, tracks: q.artist.songs.slice(0, settings.tracks)});
  }
  orderPlaylist();
  const kept = keepCurrent ? playlist.findIndex((p) => p.artist.browseId === current) : -1;
  if (kept >= 0) ai = kept; else if (ai >= playlist.length) { ai = 0; ti = 0; }
  $("stats").textContent = `${playlist.length} artists · ${new Set(playlist.map((p) => p.gig.id)).size} gigs in the next ${settings.days} days`;
  const orderText = {date: "soonest gigs first", mix: "shuffled, leaning towards gigs coming up soon", shuffle: "shuffled"}[settings.order];
  $("startText").textContent = `${playlist.length} artists playing ${cities.length > 1 ? "in and around Amsterdam" : "in Amsterdam"} in the next ${settings.days} days, ${orderText}.`;
  renderQueue();
}

// ---------- ordering ----------
// A seeded random stream, so a shuffle stays put until you ask for a new one.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function orderPlaylist() {
  if (settings.order === "date") return;  // DATA.queue is already in gig order
  const random = rng(settings.seed);
  const now = Date.now();
  // Weighted shuffle (Efraimidis–Spirakis): each artist draws random^(1/weight) and the
  // highest draws go first. "Mix" favours gigs coming up soon and "Listen more" artists.
  const weight = (p) => {
    if (settings.order === "shuffle") return 1;
    const days = Math.max(0, (new Date(p.gig.start) - now) / 86400000);
    return (1 / (1 + days / 4)) * (triage[p.artist.browseId] === "maybe" ? 2.5 : 1);
  };
  const keyed = playlist.map((p) => [Math.pow(random(), 1 / weight(p)), p]);
  keyed.sort((x, y) => y[0] - x[0]);
  playlist = keyed.map(([, p]) => p);
}

// ---------- spoken dates ----------
const ORD = ["", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth",
  "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth",
  "nineteenth", "twentieth", "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth",
  "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth", "thirty-first"];
const AMS = {timeZone: "Europe/Amsterdam"};
function spokenDay(iso) {
  const d = new Date(iso);
  const key = (x) => x.toLocaleDateString("en-CA", AMS);
  const now = new Date();
  if (key(d) === key(now)) return "tonight";
  if (key(d) === key(new Date(now.getTime() + 86400000))) return "tomorrow";
  const weekday = d.toLocaleDateString("en-GB", {...AMS, weekday: "long"});
  const month = d.toLocaleDateString("en-GB", {...AMS, month: "long"});
  const day = Number(d.toLocaleDateString("en-GB", {...AMS, day: "numeric"}));
  return `on ${weekday} the ${ORD[day]} of ${month}`;
}
function spokenTime(iso) {
  const t = new Date(iso).toLocaleTimeString("en-GB", {...AMS, hour: "numeric", minute: "2-digit", hour12: true});
  return t.replace(":00", "").replace(" ", "");
}
const venueName = (g) => DATA.venues[g.venue]?.name ?? g.venue;

// Phrase banks: each part of an announcement has several wordings. `pick` never
// repeats the wording it used last time for that part.
const lastPick = {};
function pick(part, options) {
  const fresh = options.length > 1 ? options.filter((_, i) => i !== lastPick[part]) : options;
  const choice = fresh[Math.floor(Math.random() * fresh.length)];
  lastPick[part] = options.indexOf(choice);
  return choice;
}
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
// "Tidewater (feat. X) [Official Video]" → "Tidewater"
const songTitle = (t) => t.replace(/\s*[([](feat|ft|with|official|lyric|audio|video|live|remaster)[^)\]]*[)\]]/gi, "").trim();

function gigParts(g) {
  const venue = venueName(g);
  const where = g.city && g.city !== "Amsterdam" ? `${venue} in ${g.city}` : venue;
  const when = spokenDay(g.start);  // "tonight" / "tomorrow" / "on Thursday the …"
  const whenBare = when.replace(/^on /, "");
  const at = new Date(g.start).getHours() >= 12 && Math.random() < 0.5 ? `, at ${spokenTime(g.start)}` : "";
  return {where, when, whenBare, at};
}
function ticketNote(g) {
  if (g.availability === "sold_out")
    return pick("sold", ["It's sold out, sadly.", "That one's already sold out.", "Tickets are gone, I'm afraid."]);
  if (g.availability === "few_left")
    return pick("few", ["Only a few tickets left.", "Tickets are nearly gone.", "It's almost sold out."]);
  const min = g.price?.min_eur;
  if (min === 0) return pick("free", ["And it's free.", "Entry is free."]);
  if (!min || Math.random() < 0.35) return "";  // prices don't need saying every time
  const eur = Number.isInteger(min) ? String(min) : min.toFixed(2);
  return pick("price", [`Tickets from ${eur} euros.`, `It's ${eur} euros to get in.`, `Tickets start at ${eur} euros.`]);
}
function announcement(p) {
  const g = p.gig, name = p.artist.name, {where, when, whenBare, at} = gigParts(g);
  if (settings.voiceMode === "name") {
    return pick("name", [`${name}. ${where}, ${whenBare}.`, `${name}, at ${where} ${when}.`, `${name}. ${cap(whenBare)}, ${where}.`]);
  }
  const intro = pick("intro", [
    `You're listening to ${name}.`, `This is ${name}.`, `On now, ${name}.`, `Here's ${name}.`,
    `This is ${name}, with ${songTitle(p.tracks[0].title)}.`,
  ]);
  const gig = pick("gig", [
    `They play ${where} ${when}${at}.`, `Catch them at ${where} ${when}${at}.`,
    `They're at ${where} ${when}${at}.`, `${cap(whenBare)}, they're playing ${where}.`,
    `You can see them at ${where} ${when}.`,
  ]);
  // Now and then, lead with the gig instead of the name.
  const text = Math.random() < 0.2
    ? `${pick("lead", ["Playing", "At"])} ${where} ${when}: ${name}.`
    : `${intro} ${gig}`;
  return `${text} ${ticketNote(g)}`.trim();
}
function microAnnouncement(p, trackIndex) {
  const name = p.artist.name, title = songTitle(p.tracks[trackIndex].title);
  const nth = ["", "second", "third", "fourth"][trackIndex] || "another";
  return pick("micro", [
    `Another one from ${name}.`, `Staying with ${name}.`, `Here's a ${nth} one from ${name}.`,
    `More from ${name}: this is ${title}.`, `Still ${name}. This one's called ${title}.`,
    `And ${title}, also by ${name}.`,
  ]);
}

// ---------- announcer with ducking ----------
function ramp(to, ms = 300) {
  if (!player?.getVolume) return Promise.resolve();
  const from = player.getVolume(), steps = 6;
  return new Promise((done) => {
    let i = 0;
    const t = setInterval(() => {
      i++; player.setVolume(Math.round(from + (to - from) * (i / steps)));
      if (i >= steps) { clearInterval(t); done(); }
    }, ms / steps);
  });
}
async function announce(text) {
  speechSynthesis.cancel();
  $("voice").hidden = false;
  $("voiceText").textContent = `“${text}”`;
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices().find((x) => x.name === settings.voiceName);
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
  u.rate = 1.0;
  await ramp(20);
  u.onend = u.onerror = () => ramp(100);
  speechSynthesis.speak(u);
}

// ---------- YouTube player ----------
let player = null, announcedFor = null, announcedVideo = null, started = false;
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("yt", {
    width: "100%", height: "100%",
    playerVars: {playsinline: 1, rel: 0, origin: location.origin},
    events: {
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) next();
        if (e.data === YT.PlayerState.PLAYING) {
          $("play").firstChild.textContent = "Pause ";
          const p = playlist[ai];
          const videoId = p?.tracks[ti].videoId;
          if (p && videoId !== announcedVideo && settings.voiceMode !== "off") {
            announcedVideo = videoId;
            if (announcedFor !== p.artist.browseId) {
              announcedFor = p.artist.browseId;
              announce(announcement(p));
            } else if (settings.voiceMode === "short" && Math.random() < 0.6) {
              announce(microAnnouncement(p, ti));  // same artist, next track
            }
          }
        }
        if (e.data === YT.PlayerState.PAUSED) $("play").firstChild.textContent = "Play ";
      },
      onError: () => next(),  // e.g. the uploader disabled embedding
    },
  });
};
document.head.append(el("script", {src: "https://www.youtube.com/iframe_api"}));
setInterval(() => {
  if (!player?.getDuration) return;
  const d = player.getDuration() || 0, t = player.getCurrentTime() || 0;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  $("tNow").textContent = fmt(t); $("tLen").textContent = fmt(d);
  $("tBar").style.width = d ? `${(100 * t) / d}%` : "0";
}, 500);

function load(a, t) {
  if (!playlist.length) return;
  ai = (a + playlist.length) % playlist.length;
  ti = t;
  const p = playlist[ai];
  if (announcedFor !== p.artist.browseId) $("voice").hidden = true;
  player?.loadVideoById?.(p.tracks[ti].videoId);
  render();
}
function next() {
  const p = playlist[ai];
  if (p && ti + 1 < p.tracks.length) load(ai, ti + 1); else load(ai + 1, 0);
}
function prev() { if (ti > 0) load(ai, ti - 1); else load(ai - 1, 0); }
function toggle() {
  if (!started) return begin();
  const s = player?.getPlayerState?.();
  if (s === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
}
function begin() {
  started = true;
  $("start").hidden = true;
  load(ai, ti);
}

// ---------- rendering ----------
const fmtWhen = (iso, opts) => new Date(iso).toLocaleString("en-GB", {...AMS, ...opts});
function render() {
  const p = playlist[ai];
  if (!p) return;
  const g = p.gig, a = p.artist, track = p.tracks[ti];
  $("photo").style.backgroundImage = a.image ? `url("${a.image}")` : "";
  $("eyebrow").textContent = `Now playing · track ${ti + 1} of ${p.tracks.length}`;
  $("track").textContent = track.title + (track.album ? ` · ${track.album}` : "");
  $("artist").textContent = a.name;
  $("tDay").textContent = fmtWhen(g.start, {day: "numeric"});
  $("tMon").textContent = fmtWhen(g.start, {month: "short"}).toUpperCase();
  $("tVenue").textContent = [venueName(g), g.room].filter(Boolean).join(" · ");
  const days = Math.round((new Date(g.start) - new Date()) / 86400000);
  const meta = [fmtWhen(g.start, {weekday: "short"}), fmtWhen(g.start, {hour: "2-digit", minute: "2-digit"}),
    g.city !== "Amsterdam" ? g.city : null,
    g.price?.min_eur != null ? `€${g.price.min_eur}${g.price.max_eur && g.price.max_eur !== g.price.min_eur ? "–" + g.price.max_eur : ""}` : null,
    days <= 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`];
  $("tMeta").textContent = meta.filter(Boolean).join(" · ");
  $("tMeta").classList.toggle("soldout", g.availability === "sold_out");
  if (g.availability === "sold_out") $("tMeta").textContent += " · SOLD OUT";
  $("tLinks").replaceChildren(
    g.ticket_url ? el("a", {href: g.ticket_url, target: "_blank", rel: "noopener", textContent: "Tickets ↗"}) : null,
    g.url ? el("a", {href: g.url, target: "_blank", rel: "noopener", textContent: "Gig page ↗"}) : null,
    el("a", {href: `https://music.youtube.com/channel/${a.browseId}`, target: "_blank", rel: "noopener", textContent: "YT Music ↗"}));
  $("facts").replaceChildren(
    a.monthlyListeners ? el("span", {}, el("b", {textContent: a.monthlyListeners}), " monthly listeners") : null,
    g.support?.length ? el("span", {}, "with ", el("b", {textContent: g.support.join(", ")})) : null);
  $("tags").replaceChildren(...[...g.genres, ...g.categories].slice(0, 8).map((t) => el("span", {textContent: t})));
  $("desc").textContent = a.description || "";
  $("desc").classList.remove("open");
  $("debug").textContent = `listing: “${g.title}” → parsed “${p.parsed}” → matched “${a.name}”`;
  document.querySelectorAll("[data-sort]").forEach((b) => b.classList.toggle("on", triage[a.browseId] === b.dataset.sort));
  renderQueue();
}
const STATE = {maybe: "listen more", go: "want to go", tix: "got tickets", nope: "not for me"};
function renderQueue() {
  const items = playlist.map((p, i) => {
    const s = triage[p.artist.browseId];
    return el("li", {className: (i === ai && started ? "current " : "") + (i < ai && started ? "dim" : ""), onclick: () => { if (!started) { started = true; $("start").hidden = true; } load(i, 0); }},
      el("div", {className: "thumb", style: p.artist.image ? `background-image:url("${p.artist.image}")` : ""}),
      el("div", {}, el("b", {}, p.artist.name, s ? el("span", {className: "state s-" + s, textContent: STATE[s]}) : null),
        el("span", {textContent: `${venueName(p.gig)} · ${fmtWhen(p.gig.start, {weekday: "short", day: "numeric", month: "short"})}`})));
  });
  $("queue").replaceChildren(...items);
  $("queue").children[ai]?.scrollIntoView({block: "nearest"});
  const counts = Object.values(triage).reduce((c, s) => ({...c, [s]: (c[s] || 0) + 1}), {});
  $("board").textContent = ["maybe", "go", "tix"].filter((s) => counts[s]).map((s) => `${counts[s]} ${STATE[s]}`).join(" · ");
}
function sortArtist(state) {
  const p = playlist[ai];
  if (!p) return;
  const id = p.artist.browseId;
  triage = {...triage};
  if (triage[id] === state) delete triage[id]; else triage[id] = state;
  store.set("triage", triage);
  if (state === "nope" && triage[id]) { load(ai + 1, 0); buildPlaylist(true); } else render();
}

$("missTitle").textContent = `${DATA.unmatched.length} names not found on YouTube Music`;
$("misses").replaceChildren(...DATA.unmatched.map((m) =>
  el("li", {textContent: `${m.name} — “${m.title}” (${m.venue})`})));

// ---------- controls ----------
$("go").onclick = begin;
$("play").onclick = toggle;
$("next").onclick = next;
$("prev").onclick = prev;
$("nextArtist").onclick = () => load(ai + 1, 0);
$("desc").onclick = () => $("desc").classList.toggle("open");
document.querySelectorAll("[data-sort]").forEach((b) => (b.onclick = () => sortArtist(b.dataset.sort)));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  const keys = {" ": toggle, ArrowRight: next, ArrowLeft: prev, n: () => load(ai + 1, 0),
    "1": () => sortArtist("maybe"), "2": () => sortArtist("go"), "3": () => sortArtist("tix"), x: () => sortArtist("nope")};
  const f = keys[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (f) { e.preventDefault(); f(); }
});

renderSettings();
buildPlaylist();
</script>
</body>
