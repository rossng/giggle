[project]
name = "podia"
version = "0.1.0"
description = "Agendas of Dutch music venues as structured events"
readme = "README.md"
license = "BlueOak-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "selectolax>=0.3.21,<0.5",
    "protego>=0.3,<1",
    "icalendar>=6,<8",
    "tzdata; sys_platform == 'win32'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.scripts]
podia = "podia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
