# Which events giggle leaves out, and why.
#
# Rules are checked in order; the first match drops the event with its `reason`.
# All conditions in a rule must hold. Matching is case-insensitive and exact, except
# `genre_prefix`. A rule doesn't apply if the event has any `unless_*` value.
#
#   status        event status (cancelled, postponed, moved)
#   venue         venue slug
#   category      any of the event's categories (event type: Concert, Clubnacht, Film…)
#   category_word a whole word or phrase anywhere in a category ("comedy" in "Comedy!")
#   genre         any of the event's genres
#   genre_prefix  any genre starting with this text
#   no_genres     true: the event has no genres at all

[[rule]]
reason = "cancelled"
status = ["cancelled"]

# Club and dance nights. A club genre alone isn't enough when the venue also calls it a
# concert: live bands get tagged "Drum & Bass" or "House" too.
[[rule]]
reason = "club night"
category = ["clubnacht", "club", "dance", "dance/nacht", "party"]

[[rule]]
reason = "club night"
genre = [
    "clubnacht", "nachtleven", "dance / by night", "techno", "house", "house/techno",
    "rave", "edm", "trance", "club3", "club", "club / dance",
]
unless_category = ["concert", "muziek", "music", "pop", "jazz", "global"]

# Q-Factory files everything as a concert, its ADE techno and rave nights included; those
# carry "Dance" and no pop genre (Jacek Stachursky's show is "Dance, Pop"). Ziggo Dome has
# no types at all: its ADE nights are "Dance" too (SCOOTER is "Rock, Dance").
[[rule]]
reason = "club night"
venue = ["qfactory", "ziggodome"]
genre = ["dance"]
unless_genre = ["pop", "rock", "indie", "jazz"]

# DJ nights in a venue's own words (De Nieuwe Anita: "DJ's all night!", "Disco!").
[[rule]]
reason = "club night"
category_word = ["dj's all night", "dj night", "disco"]

# OT301 files its DJ nights (and the odd live electronic act among them) as one type.
[[rule]]
reason = "club night"
category = ["electronic music, party"]

[[rule]]
reason = "club night"
genre_prefix = ["club - "]
unless_category = ["concert"]

# Classical and contemporary classical, unless the venue also files it under a
# popular genre (Muziekgebouw tags crossover shows "hedendaags" + "jazz", for example).
[[rule]]
reason = "classical"
category = ["chamber music", "symphonic music"]

[[rule]]
reason = "classical"
genre = [
    "klassiek", "kamermuziek", "symfonisch", "oude muziek", "oud", "neoklassiek",
    "nieuwe muziek", "hedendaags", "strijkkwartet", "minimal music", "vocaal",
    "viool/altviool/cello", "blaasinstrumenten", "piano",
]
unless_genre = [
    "jazz", "pop", "global", "elektronisch", "electronic", "pop / rock", "rock",
    "indie", "soul/funk/jazz",
]

[[rule]]
reason = "tribute act"
genre = ["tribute", "klassiekers / tributes", "cover / tribute"]

[[rule]]
reason = "not music"
category = [
    "film", "expositie", "theater", "talk", "workshop", "kunst", "natuur",
    "kinderactiviteit", "doorlopend", "knowledge & debate", "education & participation",
    "guided tours", "corporate/sponsor events", "business events", "bar/cafe",
    "course/workshop", "literair / wetenschap / politiek / kunst", "vrije ruimte",
    "food, kitchen", "bar", "dance performance", "restaurant",
]
unless_genre = ["pop", "jazz", "rock", "indie", "global", "pop / rock"]

[[rule]]
reason = "not music"
genre = [
    "kennis & debat", "comedy", "cultuur & maatschappij", "spoken word", "(pop)cultuur",
    "educatie", "muziekdocumentaire", "film", "theater/dans", "panel/workshop", "sport",
]

# Some venues name each event's type in their own words (De Nieuwe Anita: "Comedy!",
# "Movie screening!", "Popquiz", "Vertelcafé"; Q-Factory: "lezing"). The line-up model
# would catch most of these too, but a night without its answers keeps everything, so
# the rules have to.
[[rule]]
reason = "not music"
category_word = [
    "comedy", "cabaret", "stand-up", "improv", "impro", "burlesque", "theatre",
    "quiz", "popquiz", "bingo", "movie", "movies", "film", "cinema",
    "talk", "lecture", "lezing", "workshop", "drawing", "game", "exhibition",
    "storytelling", "spoken word", "poetry", "vertelcafé", "rondleiding",
]
unless_genre = ["pop", "jazz", "rock", "indie", "global", "pop / rock"]

# De Nieuwe Anita's Monday is its film night (Cinemanita), labelled "Anita Monday!".
[[rule]]
reason = "not music"
venue = ["nieuweanita"]
category_word = ["anita monday"]

# Catch-all types: EKKO's "Overig" (quizzes, cabaret), Het Zonnehuis's "Divers"
# (dance afternoons, film festivals) and De Helling's "Anders", unless also filed as music.
[[rule]]
reason = "not music"
category = ["overig", "divers", "anders"]
unless_category = ["concert", "club", "muziek"]

[[rule]]
reason = "family / children"
category = ["family", "kinderen"]

[[rule]]
reason = "family / children"
genre = ["familie", "familieconcerten", "jeugd / familie"]
unless_genre = ["pop", "jazz", "rock", "indie"]

# Muziekgebouw tags every concert with a genre; the untagged listings are tours,
# workshops and similar.
[[rule]]
reason = "not music"
venue = ["muziekgebouw"]
no_genres = true

# The stadium's calendar is mostly football (Eredivisie, Oranje, European cups), filed by
# competition; its concerts say "Concert".
[[rule]]
reason = "not music"
venue = ["johancruijffarena"]
unless_category = ["concert"]
