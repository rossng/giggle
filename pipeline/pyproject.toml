[project]
name = "giggle-pipeline"
version = "0.1.0"
description = "giggle's nightly build: collect, filter and publish gigs"
license = "BlueOak-1.0.0"
requires-python = ">=3.12"
# Upper bounds keep lockfile maintenance (which Renovate merges by itself) to non-breaking
# releases; raising one is a reviewed change.
dependencies = [
    "httpx>=0.28,<1",  # imported directly (llm, musicbrainz, lastfm), not only via podia
    "lameenc>=1.8.4,<2",
    "numpy>=2.5.3,<3",
    "podia",
    "ytmusicapi>=1.12.3,<2",
]

[project.scripts]
giggle-build = "giggle_pipeline.build:main"
giggle-issues = "giggle_pipeline.issues:main"
giggle-voice-samples = "giggle_pipeline.voice:samples_main"

[project.optional-dependencies]
voice = [
    "kokoro-onnx>=0.6.1,<0.7",
]

[tool.uv.sources]
podia = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
